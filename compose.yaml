name: ivory-invites
services:
  invites:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "${INVITES_PORT:-30012}:8080"
    environment:
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:?Set the HTTPS address in .env}"
      INVITES_OWNER_EMAIL: "${INVITES_OWNER_EMAIL:-admin@ivorydigital.uk}"
      INVITES_SMTP_HOST: "${INVITES_SMTP_HOST:-smtp.hostinger.com}"
      INVITES_SMTP_PORT: "${INVITES_SMTP_PORT:-465}"
      INVITES_SMTP_PASSWORD_FILE: /run/secrets/invites_smtp_password
    secrets:
      - invites_smtp_password
    volumes:
      - type: bind
        source: "${INVITES_DATA_PATH:?Set the client-data dataset path in .env}"
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4).close()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
secrets:
  invites_smtp_password:
    file: ./.smtp-password
